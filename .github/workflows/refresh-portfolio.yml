name: Refresh live portfolio

# Pulls the daily Dhan portfolio snapshot into src/data/portfolio.json and
# commits it. Enable by adding DHAN_CLIENT_ID + DHAN_ACCESS_TOKEN repo secrets.
# Until then the site renders the committed seed data.

on:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, weekdays (after market close)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull portfolio from Dhan
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: npx -y tsx scripts/refresh-portfolio.ts

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- src/data/portfolio.json; then
            git config user.name "portfolio-bot"
            git config user.email "bot@users.noreply.github.com"
            git add src/data/portfolio.json
            git commit -m "chore: refresh live portfolio $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No change in portfolio.json"
          fi

      - name: Trigger Vercel redeploy (optional)
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" || true
